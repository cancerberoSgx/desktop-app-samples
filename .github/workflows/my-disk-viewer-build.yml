name: my-disk-viewer build

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: my-disk-viewer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mydiskviewer-linux
            dist-dir: dist/mydiskviewer
          - os: windows-latest
            asset: mydiskviewer-windows
            dist-dir: dist/mydiskviewer
          - os: macos-latest
            asset: mydiskviewer-macos
            dist-dir: dist/mydiskviewer.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: my-disk-viewer/requirements.txt

      # wxPython ships prebuilt wheels for Windows/macOS, but on Linux pip may
      # need to build it from source, which requires wxWidgets' own build
      # dependencies (GTK headers, etc.) to be present.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libsdl2-dev \
            libwebkit2gtk-4.1-dev \
            freeglut3-dev \
            libjpeg-dev \
            libtiff-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm mydiskviewer.spec

      # actions/upload-artifact would otherwise re-zip the raw dist folder
      # anyway, but only as an internal Actions-run artifact - packaging it
      # ourselves here means the exact same .zip also becomes the public
      # release asset in the "release" job below, with a name matching what
      # docs/my-disk-viewer/index.html's download buttons would expect if
      # a homepage is added for this app later.
      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$(dirname '${{ matrix.dist-dir }}')"
          zip -r "${{ github.workspace }}/${{ matrix.asset }}.zip" "$(basename '${{ matrix.dist-dir }}')"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.dist-dir }}" -DestinationPath "${{ github.workspace }}\${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  # Publishes two GitHub Releases from the three zipped binaries above:
  #   - a versioned one (mydiskviewer-build.<run number>) that's never
  #     touched again, giving a permanent build history.
  #   - "mydiskviewer-latest", deleted and recreated every run, whose asset
  #     URLs never change - this is what a future docs/my-disk-viewer/index.html's
  #     download buttons would link to, so a homepage would need no edits when a
  #     new build is published.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release-assets
          find artifacts -type f -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "mydiskviewer-build.${{ github.run_number }}" release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "My Disk Viewer build #${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}."

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mydiskviewer-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create mydiskviewer-latest release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "My Disk Viewer (latest build)" \
            --notes "Always the most recent successful build. For version history, see releases prefixed mydiskviewer-build.*"
