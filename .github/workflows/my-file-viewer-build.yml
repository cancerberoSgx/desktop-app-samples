name: my-file-viewer build

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'my-file-viewer-v*'

jobs:
  # Guards against tagging without bumping VERSION (or vice versa) - the tag
  # is what a real release build runs off, VERSION is the source of truth an
  # in-app About dialog reads from a frozen build (which has no .git to
  # derive a version from at runtime), so the two must always agree. Also
  # exposes VERSION's value as an output so later jobs can stamp it onto
  # artifact/release filenames without re-reading the file themselves.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and verify it matches the tag (if any)
        id: version
        run: |
          file_version="$(cat my-file-viewer/VERSION)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#my-file-viewer-v}"
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME (version $tag_version) doesn't match my-file-viewer/VERSION ($file_version)"
              exit 1
            fi
          fi
          echo "value=$file_version" >> "$GITHUB_OUTPUT"
          echo "Building version $file_version"

  build:
    needs: check-version
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    defaults:
      run:
        working-directory: my-file-viewer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: myfileviewer-linux
            dist-dir: dist/myfileviewer
          - os: windows-latest
            asset: myfileviewer-windows
            dist-dir: dist/myfileviewer
          - os: macos-latest
            asset: myfileviewer-macos
            dist-dir: dist/myfileviewer.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: my-file-viewer/requirements.txt

      # wxPython ships prebuilt wheels for Windows/macOS, but on Linux pip may
      # need to build it from source, which requires wxWidgets' own build
      # dependencies (GTK headers, etc.) to be present.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libsdl2-dev \
            libwebkit2gtk-4.1-dev \
            freeglut3-dev \
            libjpeg-dev \
            libtiff-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm myfileviewer.spec

      # actions/upload-artifact would otherwise re-zip the raw dist folder
      # anyway, but only as an internal Actions-run artifact - packaging it
      # ourselves here means the exact same versioned .zip also becomes the
      # versioned release asset in the "release" job below. The rolling
      # "myfileviewer-latest" release (what docs/my-file-viewer/index.html's
      # download buttons link to) needs unversioned filenames instead - the
      # release job strips the version back off for those, rather than this
      # job producing two copies of every zip.
      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$(dirname '${{ matrix.dist-dir }}')"
          zip -r "${{ github.workspace }}/${{ matrix.asset }}-${{ env.VERSION }}.zip" "$(basename '${{ matrix.dist-dir }}')"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.dist-dir }}" -DestinationPath "${{ github.workspace }}\${{ matrix.asset }}-${{ env.VERSION }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-${{ env.VERSION }}
          path: ${{ matrix.asset }}-${{ env.VERSION }}.zip

  # Publishes two GitHub Releases from the three zipped binaries above:
  #   - a versioned one, with versioned asset filenames
  #     (myfileviewer-linux-1.0.0.zip etc.) - when this run was triggered by
  #     pushing a my-file-viewer-v* tag, the release is published on that
  #     same tag (e.g. my-file-viewer-v1.0.0); a plain workflow_dispatch
  #     test run (no such tag) falls back to the old
  #     myfileviewer-build.<run number> naming instead. Either way, once
  #     published it's never touched again, giving a permanent build history.
  #   - "myfileviewer-latest", deleted and recreated every run, with the
  #     version stripped back off each asset's filename - this is what
  #     docs/my-file-viewer/index.html's download buttons link to, so both
  #     the release name *and* the asset filenames must stay stable, or the
  #     homepage would need edits every release.
  release:
    needs: [build, check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release-assets
          find artifacts -type f -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Determine release tag and title
        id: release-info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=My File Viewer ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=myfileviewer-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=My File Viewer build #${{ github.run_number }} (dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release-info.outputs.tag }}" release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ steps.release-info.outputs.title }}" \
            --notes "Built from commit ${{ github.sha }}."

      - name: Strip version from filenames for the rolling "latest" release
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p latest-assets
          for f in release-assets/*.zip; do
            unversioned="$(basename "$f" | sed "s/-${VERSION}\.zip$/.zip/")"
            cp "$f" "latest-assets/$unversioned"
          done
          ls -la latest-assets

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete myfileviewer-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create myfileviewer-latest latest-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "My File Viewer (latest build)" \
            --notes "Always the most recent successful build. For version history, see releases prefixed myfileviewer-build.* and vX.Y.Z tags."
