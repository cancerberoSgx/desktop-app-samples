name: wxwidgets-test1 build

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: wxwidgets-test1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wxdemo-linux
            dist-path: wxwidgets-test1/dist/wxdemo
          - os: windows-latest
            artifact: wxdemo-windows
            dist-path: wxwidgets-test1/dist/wxdemo
          - os: macos-latest
            artifact: wxdemo-macos
            dist-path: wxwidgets-test1/dist/wxdemo.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wxwidgets-test1/requirements.txt

      # wxPython ships prebuilt wheels for Windows/macOS, but on Linux pip may
      # need to build it from source, which requires wxWidgets' own build
      # dependencies (GTK headers, etc.) to be present.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libsdl2-dev \
            libwebkit2gtk-4.1-dev \
            freeglut3-dev \
            libjpeg-dev \
            libtiff-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --windowed --name wxdemo main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist-path }}
