name: my-redis-viewer build

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'my-redis-viewer-v*'

jobs:
  # Guards against tagging without bumping VERSION (or vice versa) - the tag
  # is what a real release build runs off, VERSION is the source of truth an
  # in-app About dialog could read from a frozen build (which has no .git to
  # derive a version from at runtime), so the two must always agree. A no-op
  # on workflow_dispatch runs (there's no tag to check against yet).
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION file
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#my-redis-viewer-v}"
          file_version="$(cat my-redis-viewer/VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) doesn't match my-redis-viewer/VERSION ($file_version)"
            exit 1
          fi
          echo "Building version $file_version"

  build:
    needs: check-version
    defaults:
      run:
        working-directory: my-redis-viewer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: myredisviewer-linux
            dist-dir: dist/myredisviewer
          - os: windows-latest
            asset: myredisviewer-windows
            dist-dir: dist/myredisviewer
          - os: macos-latest
            asset: myredisviewer-macos
            dist-dir: dist/myredisviewer.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: my-redis-viewer/requirements.txt

      # wxPython ships prebuilt wheels for Windows/macOS, but on Linux pip may
      # need to build it from source, which requires wxWidgets' own build
      # dependencies (GTK headers, etc.) to be present.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libsdl2-dev \
            libwebkit2gtk-4.1-dev \
            freeglut3-dev \
            libjpeg-dev \
            libtiff-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm myredisviewer.spec

      # actions/upload-artifact would otherwise re-zip the raw dist folder
      # anyway, but only as an internal Actions-run artifact - packaging it
      # ourselves here means the exact same .zip also becomes the public
      # release asset in the "release" job below, with a name matching what
      # docs/my-redis-viewer/index.html's download buttons expect.
      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$(dirname '${{ matrix.dist-dir }}')"
          zip -r "${{ github.workspace }}/${{ matrix.asset }}.zip" "$(basename '${{ matrix.dist-dir }}')"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.dist-dir }}" -DestinationPath "${{ github.workspace }}\${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  # Publishes two GitHub Releases from the three zipped binaries above:
  #   - a versioned one - when this run was triggered by pushing a
  #     my-redis-viewer-v* tag, the release is published on that same tag
  #     (e.g. my-redis-viewer-v1.0.0); a plain workflow_dispatch test run
  #     (no such tag) falls back to the old myredisviewer-build.<run number>
  #     naming instead. Either way, once published it's never touched again,
  #     giving a permanent build history.
  #   - "myredisviewer-latest", deleted and recreated every run, whose asset
  #     URLs never change - this is what docs/my-redis-viewer/index.html's
  #     download buttons link to, so the homepage needs no edits when a new
  #     build is published.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release-assets
          find artifacts -type f -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Determine release tag and title
        id: release-info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=My Redis Viewer ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=myredisviewer-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=My Redis Viewer build #${{ github.run_number }} (dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release-info.outputs.tag }}" release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ steps.release-info.outputs.title }}" \
            --notes "Built from commit ${{ github.sha }}."

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete myredisviewer-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create myredisviewer-latest release-assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "My Redis Viewer (latest build)" \
            --notes "Always the most recent successful build. For version history, see releases prefixed myredisviewer-build.*"
